name: lab-task-manager
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - task-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: task-manager-api:local
    environment:
      DATABASE_URL: postgresql://taskmanager:${POSTGRES_PASSWORD}@database:5432/taskmanager
      NODE_ENV: production
      PORT: 3001
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped
  user-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_MODE: user
    image: incidentflow-user-ui:local
    ports:
      - "127.0.0.1:8084:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/ready"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped
  support-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_MODE: support
    image: incidentflow-support-ui:local
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/ready"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped
  admin-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_MODE: admin
    image: incidentflow-admin-ui:local
    ports:
      - "127.0.0.1:8086:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/ready"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped
volumes:
  task-data:
